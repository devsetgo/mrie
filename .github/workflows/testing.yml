name: Testing

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (pre-commit + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks (ruff + hygiene checks)
        run: pre-commit run -a

      - name: Check lint (ruff)
        run: ruff check src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Not used by the pytest run itself (that stays on DB_DRIVER: memory,
      # below) - this backs the "Apply Alembic migrations" step only, so CI
      # actually exercises the Postgres-only migrations (e.g. the
      # NoteMetrics materialized view) at least once, closing the gap where
      # CI never touched Postgres at all even though production runs it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same in-memory-DB/dev-login test posture conftest.py forces locally -
      # set explicitly here too since that's belt-and-suspenders, not a
      # substitute for the required-but-unused-under-memory-driver settings
      # below (DB_USERNAME/PASSWORD/HOST/PORT/NAME, PHRASE/SALT) which have
      # no default and must be present for Settings() to construct at all.
      DB_DRIVER: memory
      RELEASE_ENV: test
      DEV_FAKE_LOGIN_ENABLED: "True"
      HTTPS_ONLY: "False"
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci
      PHRASE: ci-test-phrase-not-a-real-secret
      SALT: ci-test-salt-not-a-real-secret
      ADMIN_USER: ci-admin
      SESSION_SECRET_KEY: ci-test-session-secret-not-a-real-secret
      REGISTRATION_BOOTSTRAP_TOKEN: ci-test-bootstrap-token
      # Also required - Settings.openai_key is typed SecretStr with a `None`
      # default, which pydantic only accepts because a real OPENAI_KEY is
      # always present in the local .env; CI has no .env, so this must be
      # supplied explicitly or Settings() fails to construct at import time,
      # before any test runs (ai.py's own OpenAI calls are never exercised
      # in this suite - see PROJECT_STATUS.md - so the value itself is unused).
      OPENAI_KEY: ci-test-openai-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Apply Alembic migrations against CI Postgres
        run: alembic upgrade head
        env:
          DB_DRIVER: postgres

      - name: Test with pytest
        run: PYTHONPATH=. pytest
