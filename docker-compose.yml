# Production: a single container on a single server, behind Traefik, with the
# SQLite database on a named volume. The healthcheck lives in the dockerfile.
#
# Exactly one container must ever own the database file: do not add
# `deploy.replicas` or scale this service. SQLite locking across containers
# on one host's volume does work, but it gains nothing here and a second
# host can't share the file at all.
services:
  mikeryan:
    image: mikeryan56/mikeryanie:2024-10-25-001
    env_file:
      - .env
    environment:
      # Pinned here, not left to .env, so the volume mount below and the
      # path the app writes to can't drift apart.
      DB_DRIVER: sqlite
      DB_DIRECTORY: /app/sqlite_db
      # Traefik's address must be trusted for X-Forwarded-Proto, or the app
      # emits http:// asset URLs on the https site (see dockerfile). "*" is
      # safe only because port 5000 is not published to the host - Traefik
      # on the `web` network is the only thing that can reach it.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped
    # Give uvicorn time to finish in-flight requests and run its shutdown
    # hook (PRAGMA optimize, WAL checkpoint) before Docker sends SIGKILL.
    stop_grace_period: 30s
    networks:
      - web
    labels:
      - "traefik.http.middlewares.mrie-https.redirectscheme.scheme=https"
      #### Labels define the behavior and rules of the traefik proxy for this container ####
      - "traefik.enable=true" # <== Enable traefik to proxy this container
      - "traefik.http.services.mrie.loadbalancer.server.port=5000"
      - "traefik.http.routers.mrie-web.rule=Host(`www.mikeryan.ie`, `mikeryan.ie`)" # <== Your Domain Name goes here for the http rule
      - "traefik.http.routers.mrie-web.entrypoints=web" # <== Defining the entrypoint for http
      - "traefik.http.routers.mrie-web.middlewares=redirect@file" # <== This is a middleware to redirect to https
      - "traefik.http.routers.mrie-secured.rule=Host(`www.mikeryan.ie`, `mikeryan.ie`)" # <== Your Domain Name for the https rule
      - "traefik.http.routers.mrie-secured.entrypoints=web-secured" # <== Defining entrypoint for https
      - "traefik.http.routers.mrie-secured.tls.certresolver=mytlschallenge" # <== Defining certsresolvers for https
    volumes:
      # Must be a local volume (not NFS/SMB): SQLite's WAL mode relies on
      # shared-memory locking that network filesystems don't provide.
      - db-volume:/app/sqlite_db
      - log-volume:/app/logs

networks:
  web:
    external: true  # Ensure the 'web' network is defined and set to external if managed outside this compose file

volumes:
  db-volume:
  log-volume:
