repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Must stay in sync with requirements/dev.txt's ruff pin, or `make ruff`
    # and this hook will disagree about what "formatted" means.
    #
    # ruff replaces black (formatting), isort (the "I" lint rules) and
    # autoflake (unused imports, rule F401) - configured in pyproject.toml
    # under [tool.ruff]. Order matters: ruff-check --fix runs first so that
    # ruff-format sees the final import layout.
    rev: v0.16.6
    hooks:
      # --no-unsafe-fixes overrides `unsafe-fixes = true` in pyproject.toml
      # for this hook only: an auto-run commit hook shouldn't silently rewrite
      # logic (e.g. dropping an "unused" assignment that has a side effect).
      # Anything it can't fix safely is still reported, and `make ruff` applies
      # the unsafe ones on request.
      - id: ruff-check
        args: [--fix, --no-unsafe-fixes]
      - id: ruff-format
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: fix-encoding-pragma
      - id: trailing-whitespace
      # - id: check-json
      # - id: pretty-format-json
      - id: requirements-txt-fixer

      # - id: flake8
