repos:
-   repo: https://github.com/psf/black
    # Must stay in sync with requirements/dev.txt's black pin - 23.1.0 (the
    # long-standing default) still references `ast.Str`, which Python 3.12+
    # removed from the `ast` module entirely. That only ever failed in CI
    # (a fresh hook env built against language_version: python3.14 below);
    # locally it was masked by an already-built ~/.cache/pre-commit venv
    # from before language_version was pinned to 3.14.
    rev: 26.5.1
    hooks:
    - id: black
      language_version: python3.14
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: fix-encoding-pragma
      - id: trailing-whitespace
      # - id: check-json
      # - id: pretty-format-json
      - id: requirements-txt-fixer

