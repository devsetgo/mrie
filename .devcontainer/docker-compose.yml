version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    command: sleep infinity
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
